[start]
command:/usr/local/etc/rc.d/hasyncd start
parameters:
type:script
message:starting hasyncd

[stop]
command:/usr/local/etc/rc.d/hasyncd stop
parameters:
type:script
message:stopping hasyncd

[restart]
command:/usr/local/etc/rc.d/hasyncd restart
parameters:
type:script
message:restarting hasyncd

[status]
command:/usr/local/etc/rc.d/hasyncd status; exit 0
parameters:
type:script_output
message:requesting hasyncd status

[ctl_status]
command:/usr/local/sbin/hasyncd ctl status
parameters:
type:script_output
message:hasyncd status

[ctl_info]
command:/usr/local/sbin/hasyncd ctl info
parameters:
type:script_output
message:hasyncd node info

[ctl_prepare]
command:/usr/local/sbin/hasyncd ctl prepare
parameters:
type:script_output
message:hasyncd open pairing window

[ctl_cancel]
command:/usr/local/sbin/hasyncd ctl cancel
parameters:
type:script_output
message:hasyncd cancel pairing

[ctl_pair]
command:/usr/local/sbin/hasyncd ctl pair
parameters:--peer %s --token-file %s
type:script_output
message:hasyncd pair with peer

[ctl_break]
command:/usr/local/sbin/hasyncd ctl break
parameters:
type:script_output
message:hasyncd break pair

[ctl_failover]
command:/usr/local/sbin/hasyncd ctl failover
parameters:
type:script_output
message:hasyncd graceful failover

[ctl_promote]
command:/usr/local/sbin/hasyncd ctl promote
parameters:
type:script_output
message:hasyncd promote

[ctl_promote_force]
command:/usr/local/sbin/hasyncd ctl promote --force
parameters:
type:script_output
message:hasyncd forced promote

[ctl_demote]
command:/usr/local/sbin/hasyncd ctl demote
parameters:
type:script_output
message:hasyncd demote

[ctl_resync]
command:/usr/local/sbin/hasyncd ctl resync
parameters:
type:script_output
message:hasyncd full config resync

[ctl_events]
command:/usr/local/sbin/hasyncd ctl events
parameters:
type:script_output
message:hasyncd recent events

[ctl_failover_force]
command:/usr/local/sbin/hasyncd ctl failover --force
parameters:
type:script_output
message:hasyncd forced graceful failover

[ctl_maintenance]
command:/usr/local/sbin/hasyncd ctl maintenance
parameters:%s --hours %s
type:script_output
message:hasyncd maintenance mode

[ctl_preflight]
command:/usr/local/sbin/hasyncd ctl preflight
parameters:
type:script_output
message:hasyncd pre-flight check

[ctl_history]
command:/usr/local/sbin/hasyncd ctl history
parameters:
type:script_output
message:hasyncd failover history

[ctl_metrics]
command:/usr/local/sbin/hasyncd ctl metrics
parameters:
type:script_output
message:hasyncd metrics

[ctl_health]
command:/usr/local/sbin/hasyncd ctl health; exit 0
parameters:
type:script_output
message:hasyncd health summary

[ctl_upgrade_start]
command:/usr/local/sbin/hasyncd ctl upgrade start
parameters:
type:script_output
message:hasyncd guided upgrade

[ctl_upgrade_start_failback]
command:/usr/local/sbin/hasyncd ctl upgrade start --failback
parameters:
type:script_output
message:hasyncd guided upgrade with failback

[ctl_upgrade_cancel]
command:/usr/local/sbin/hasyncd ctl upgrade cancel
parameters:
type:script_output
message:hasyncd cancel upgrade

[ctl_upgrade_status]
command:/usr/local/sbin/hasyncd ctl upgrade status
parameters:
type:script_output
message:hasyncd upgrade status

[ctl_kit]
command:/usr/local/sbin/hasyncd ctl kit
parameters:--ha %s --mgmt %s --hostname %s
type:script_output
message:hasyncd build secondary kit

[ctl_kit_cancel]
command:/usr/local/sbin/hasyncd ctl kit-cancel
parameters:
type:script_output
message:hasyncd cancel secondary kit

[ctl_audit]
command:/usr/local/sbin/hasyncd ctl audit
parameters:--msg %s
type:script_output
message:hasyncd audit entry

[ctl_updates]
command:/usr/local/sbin/hasyncd ctl updates
parameters:
type:script_output
message:hasyncd update status

[ctl_updates_check]
command:/usr/local/sbin/hasyncd ctl updates-check
parameters:
type:script_output
message:hasyncd start update check
