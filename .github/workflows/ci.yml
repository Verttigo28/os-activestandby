name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  go:
    name: test and cross-build hasyncd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: vet and test
        working-directory: daemon
        run: |
          gofmt -l . | tee /dev/stderr | (! read)
          go vet ./...
          go test ./...
      - name: build for FreeBSD
        working-directory: daemon
        env: { GOOS: freebsd, GOARCH: amd64, CGO_ENABLED: '0' }
        run: go build -trimpath -ldflags '-s -w' -o ../src/sbin/hasyncd .
      - uses: actions/upload-artifact@v4
        with:
          name: src-with-daemon
          path: |
            src
            build
          retention-days: 7

  package:
    name: build the .pkg (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: src-with-daemon
          path: .
      - name: build the package on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          run: |
            VERSION="${GITHUB_REF_NAME#v}"
            chmod +x src/sbin/hasyncd
            sh build/build-pkg.sh "$PWD" "$VERSION" "$PWD/dist"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/os-activestandby-*.pkg
