name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: test and cross-build hasyncd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0' # staticcheck must be built with the same Go that compiles the code
      - name: staticcheck
        working-directory: daemon
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
      - name: format, vet, test (with the race detector)
        working-directory: daemon
        run: |
          gofmt -l . | tee /dev/stderr | (! read)
          go vet ./...
          GOOS=freebsd GOARCH=amd64 go vet ./...
          go test -race ./...
      - name: build for FreeBSD
        working-directory: daemon
        env: { GOOS: freebsd, GOARCH: amd64, CGO_ENABLED: '0' }
        run: |
          V=dev; case "$GITHUB_REF" in refs/tags/v*) V="${GITHUB_REF_NAME#v}";; esac
          go build -trimpath -ldflags "-s -w -X main.version=$V" -o ../src/sbin/hasyncd .
      - uses: actions/upload-artifact@v7
        with:
          name: src-with-daemon
          path: |
            src
            build
          retention-days: 7

  plugin:
    name: lint the GUI and script parts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: XML well-formedness (model, ACL, menu, forms, widget metadata)
        run: |
          python3 - <<PY
          import glob, sys, xml.dom.minidom
          bad = 0
          for f in glob.glob("src/**/*.xml", recursive=True):
              try:
                  xml.dom.minidom.parse(f)
              except Exception as e:
                  print(f, e); bad = 1
          sys.exit(bad)
          PY
      - name: shell scripts
        run: |
          shellcheck -S warning src/opnsense/scripts/OPNsense/ActiveStandby/*.sh src/etc/rc.d/hasyncd build/build-pkg.sh || true
      - name: JavaScript syntax (widget and views)
        run: |
          node --check src/opnsense/www/js/widgets/ActiveStandby.js
          for f in index wizard operations; do
            perl -0ne 'while(/<script>(.*?)<\/script>/sg){print $1,"\n"}' src/opnsense/mvc/app/views/OPNsense/ActiveStandby/$f.volt \
              | perl -pe 's/\{\{ lang\._\(.*?\) \}\}/T/g' > /tmp/$f.js
            node --check /tmp/$f.js
          done

  package:
    name: build and sign the .pkg (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, plugin]
    permissions:
      contents: write      # create the GitHub release, publish the pkg repository branch
      id-token: write      # build provenance attestation
      attestations: write
    runs-on: ubuntu-latest
    env:
      PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: src-with-daemon
          path: .
      - name: signed pkg repository: start from what is already published
        id: repo
        if: env.PKG_SIGNING_KEY != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: dist/repo
      - name: build the package (and the signed repository) on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          envs: 'PKG_SIGNING_KEY'
          run: |
            set -e
            VERSION="${GITHUB_REF_NAME#v}"
            chmod +x src/sbin/hasyncd
            sh build/build-pkg.sh "$PWD" "$VERSION" "$PWD/dist"
            if [ -n "$PKG_SIGNING_KEY" ]; then
              mkdir -p dist/repo/All
              cp dist/os-activestandby-*.pkg dist/repo/All/
              umask 077
              printf '%s\n' "$PKG_SIGNING_KEY" > /tmp/repo.key
              pkg repo dist/repo /tmp/repo.key
              rm -f /tmp/repo.key
            fi
      - name: checksums
        run: cd dist && sha256sum os-activestandby-*.pkg > SHA256SUMS
      - name: signed provenance for the package (verify with gh attestation verify)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/os-activestandby-*.pkg
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/os-activestandby-*.pkg
            dist/SHA256SUMS
      - name: publish the signed pkg repository (GitHub Pages branch gh-pages)
        if: env.PKG_SIGNING_KEY != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/repo
          keep_files: true
          exclude_assets: '.git'
